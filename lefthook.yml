glob_matcher: doublestar

pre-commit:
  parallel: false
  commands:
    lint:
      glob: "*.{ts,vue,mjs,js,json}"
      run: bunx oxlint --no-error-on-unmatched-pattern {staged_files}
    format:
      glob: "*.{ts,vue,mjs,js,json}"
      run: bunx oxfmt --check {staged_files}
    manifest:
      run: bun run check:manifest

pre-push:
  parallel: false
  commands:
    check:
      run: bun run check
