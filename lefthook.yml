glob_matcher: doublestar

pre-commit:
  parallel: false
  commands:
    lint:
      glob: "*.{ts,vue,mjs,js,json}"
      run: pnpm run lint --no-error-on-unmatched-pattern {staged_files}
    format:
      glob: "*.{ts,vue,mjs,js,json}"
      run: pnpm run format:check {staged_files}
    manifest:
      run: pnpm run check:manifest

pre-push:
  parallel: false
  commands:
    check:
      run: pnpm run check
