[package]
name = "dictation-gpui"
version = "0.1.0"
publish = false
edition = "2021"
description = "Kosmos Dictation — standalone GPUI overlay app over Engine RPC/WS (Vue dictation pill parity retired, this crate is the shipped product, KOS-241)"
default-run = "dictation-gpui"

[dependencies]
gpui = { package = "gpui-kit", version = "=0.6.2" }
gpui-component = "=0.6.2"
# Imago GPUI shared palette/chrome. Pinned by rev; the crate lives in
# crates/imago-gpui inside the imago repo workspace.
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "b9dd284e70a56a151b525626c3b2463679cb8c9a" }
# Shared GPUI surface (theme/widgets/fields/engine). Its gpui/imago-gpui
# specs must stay identical to cortex manager-gpui's.
kosmos-gpui-kit = { git = "https://github.com/makekosmos/kosmos-gpui-kit", rev = "b5f9b931cc4aff7aa248c88d6719569a1bd97fce" }
serde_json = "1.0.151"
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = [
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
debug = false

# Ensure gpui's build.rs (not just the lib) sees debug_assertions=false so it
# runs fxc and emits shaders_bytes.rs. Cargo's default release build-override
# can leave assertions on for build scripts.
[profile.release.build-override]
debug-assertions = false
opt-level = 0

# Unconditional so build.rs can invoke embed_resource::compile unconditionally
# once its CARGO_CFG_TARGET_OS check passes (target-gated deps would also
# resolve for a Windows target, but the crate name would still need cfg-gated
# code paths in build.rs on non-Windows builds).
[build-dependencies]
embed-resource = "3.0"
