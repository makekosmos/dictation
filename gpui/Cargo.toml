[package]
name = "dictation-gpui"
version = "0.4.2"
edition = "2021"
description = "Mundus Dictation — standalone GPUI overlay app over Engine RPC/WS"
default-run = "dictation-gpui"

[dependencies]
gpui = { package = "gpui-kit", version = "=0.6.2" }
gpui-component = "=0.6.2"
# Imago GPUI shared palette/chrome. Pinned by rev; the crate lives in
# crates/imago-gpui inside the imago repo workspace.
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "c7ae7944782af5ec903c6332bfef362bb03e03b8" }
# Shared GPUI surface (theme/widgets/fields/engine + typed EngineError).
# Since KOS-319 the kit lives at crates/mundus-gpui-kit inside imago — pin
# the SAME imago rev as imago-gpui so the lockfile holds one source.
mundus-gpui-kit = { git = "https://github.com/makekosmos/imago.git", rev = "c7ae7944782af5ec903c6332bfef362bb03e03b8" }
serde_json = "1.0.151"
# Queue row titles render RFC 3339 timestamps as local «1 окт., 14:32».
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = [
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

# #[gpui::test] + TestAppContext live behind gpui's test-support feature
# (deterministic executors, test platform). It merges only into test builds.
[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.6.2", features = ["test-support"] }

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
debug = false

# Windows exe icon: build.rs compiles windows/app.rc (1 ICON app.ico).
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"
