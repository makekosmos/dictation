[package]
name = "dictation-gpui"
version = "0.4.5"
edition = "2021"
description = "Mundus Dictation — standalone GPUI overlay app over Engine RPC/WS"
default-run = "dictation-gpui"

[dependencies]
# gpui-kit 0.8 routes windows and rendering through gpui-fast — the same
# renderer Manager and Atlas run on.
gpui = { package = "gpui-kit", version = "=0.8.0", features = ["gpui-fast"] }
gpui-component = { version = "=0.8.0", features = ["gpui-fast"] }
# Imago GPUI shared palette/chrome. Pinned by rev; the crate lives in
# crates/imago-gpui inside the imago repo workspace.
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "0dc83f181d0f091f7da074583079582278c407fd" }
# Shared GPUI surface (theme/widgets/fields/engine + typed EngineError).
# Since KOS-319 the kit lives at crates/mundus-gpui-kit inside imago — pin
# the SAME imago rev as imago-gpui so the lockfile holds one source.
mundus-gpui-kit = { git = "https://github.com/makekosmos/imago.git", rev = "0dc83f181d0f091f7da074583079582278c407fd" }
serde_json = "1.0.151"
# Queue row titles render RFC 3339 timestamps as local «1 окт., 14:32».
chrono = "0.4"
wgpu = "=29.0.4"
pollster = "0.4"
image = { version = "=0.25.10", default-features = false }
anyhow = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = [
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_Media_Audio",
] }

# #[gpui::test] + TestAppContext live behind gpui's test-support feature
# (deterministic executors, test platform). It merges only into test builds.
[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.8.0", features = ["test-support", "gpui-fast"] }

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The blanket dev profile above disables dependency assertions; UI probes in
# test-support builds need debug selectors, so re-enable them for gpui-fast.
[profile.dev.package.gpui-fast]
debug-assertions = true

[profile.dev.package.gpui-fast-macros]
debug-assertions = true

[profile.release]
debug = false
# MUST stay false: gpui-pre-windows compiles its HLSL shaders via fxc only
# when build scripts are built without debug assertions.
debug-assertions = false

# Ensure gpui's build.rs (not just the lib) sees debug_assertions=false so it
# runs fxc. Cargo's default release build-override can leave assertions on for
# build scripts.
[profile.release.build-override]
debug-assertions = false
opt-level = 0

# One gpui-fast/gpui-pre source for the whole graph: consumers pin this Imago
# rev and apply the same overrides (see imago/Cargo.toml).
#
# The patch only wins when the version matches: gpui-base 0.8.0 needs
# gpui-fast 0.1.10's API, while crates.io already has 0.1.11, so Cargo.lock
# must keep the whole gpui-fast-* family at 0.1.10. After a bare
# `cargo update`, re-pin with:
#   cargo update -p gpui-fast --precise 0.1.10
[patch.crates-io]
gpui-fast = { git = "https://github.com/makekosmos/imago.git", rev = "0dc83f181d0f091f7da074583079582278c407fd" }
gpui-pre = { git = "https://github.com/makekosmos/imago.git", rev = "0dc83f181d0f091f7da074583079582278c407fd" }

# Windows exe icon: build.rs compiles windows/app.rc (1 ICON app.ico).
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"
