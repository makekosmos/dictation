[package]
name = "dictation-gpui"
version = "0.1.0"
edition = "2021"
description = "Mundus Dictation — standalone GPUI overlay app over Engine RPC/WS (Vue dictation pill parity)"
default-run = "dictation-gpui"

[dependencies]
gpui = { package = "gpui-kit", version = "=0.6.2" }
gpui-component = "=0.6.2"
# Imago GPUI shared palette/chrome. Pinned by rev; the crate lives in
# crates/imago-gpui inside the imago repo workspace.
imago-gpui = { git = "https://github.com/makekosmos/imago.git", rev = "b9dd284e70a56a151b525626c3b2463679cb8c9a" }
# Shared GPUI surface (theme/widgets/fields/engine). Its gpui/imago-gpui
# specs must stay identical to cortex manager-gpui's. The crate is renamed
# mundus-gpui-kit in 0.10.0; the repo URL keeps the old name until the
# makekosmos org is renamed (GitHub redirects).
mundus-gpui-kit = { git = "https://github.com/makekosmos/kosmos-gpui-kit", rev = "ff8edf8423ff83c39d9b7c3498f86fd0141d848a" }
serde_json = "1.0.151"
raw-window-handle = "0.6"
windows-sys = { version = "0.61.2", features = [
  "Win32_System_Threading",
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
] }

# Dev builds: keep debug info but optimize — unoptimized taffy/cosmic-text/
# gpui (and our own render path) make even modest UIs run at ~20fps.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.release]
debug = false

# Windows exe icon: build.rs compiles windows/app.rc (1 ICON app.ico).
[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "3.0"
